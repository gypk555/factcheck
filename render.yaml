# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render choose New > Blueprint and pick the repo.
services:
  - type: web
    name: truthlens
    runtime: python
    plan: free
    # Only the small runtime dependencies are installed; the trained model is in models/.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn truthlens.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      # Optional. Paste a Google Fact Check Tools API key in the Render dashboard
      # to enable the "Published fact-checks" panel. Never commit it to git.
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false
