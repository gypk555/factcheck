# Render Blueprint: the website is a static site (free, always on, no cold starts).
# Deploy: push this repo to GitHub, then in Render choose New > Blueprint and pick the repo.
# The model itself runs in Google Colab (colab/XFND_CLIP_Server.ipynb).
services:
  - type: web
    name: xfnd-clip
    runtime: static
    buildCommand: ""
    staticPublishPath: ./web
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.trycloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
